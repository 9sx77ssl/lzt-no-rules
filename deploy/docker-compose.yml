services:
  no-rules:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lzt-no-rules:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /data/no-rules.db
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Usage:
#   docker compose -f deploy/docker-compose.yml up -d --build
# nginx still terminates TLS and proxies to 127.0.0.1:8787.
