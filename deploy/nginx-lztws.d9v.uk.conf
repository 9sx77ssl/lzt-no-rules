# No Rules Chatbox WebSocket origin for wss://lztws.d9v.uk/ws
# Cloudflare is in front (orange cloud); origin keeps only 127.0.0.1:8787 open.

upstream no_rules_ws {
    server 127.0.0.1:8787;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

limit_conn_zone $binary_remote_addr zone=no_rules_conn:10m;

# Cloudflare sends the real client IP in CF-Connecting-IP. Keep the value for
# application-side rate limiting and logs; never trust X-Forwarded-For directly
# from the public internet.
map $http_cf_connecting_ip $no_rules_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name lztws.d9v.uk;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lztws.d9v.uk;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/lztws.d9v.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lztws.d9v.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 1m;
    keepalive_timeout 65s;
    send_timeout 30s;

    access_log /var/log/nginx/no-rules-access.log;
    error_log  /var/log/nginx/no-rules-error.log warn;

    # ── WebSocket endpoint ────────────────────────────────────────────────────
    location = /ws {
        limit_conn no_rules_conn 20;

        proxy_pass http://no_rules_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $no_rules_client_ip;
        proxy_set_header X-Forwarded-For $no_rules_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;
    }

    # ── Health/version endpoints ─────────────────────────────────────────────
    location = /health {
        proxy_pass http://no_rules_ws/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $no_rules_client_ip;
        proxy_set_header X-Forwarded-For $no_rules_client_ip;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /version {
        proxy_pass http://no_rules_ws/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = / {
        default_type application/json;
        return 200 '{"ok":true,"name":"no-rules-chat","websocket":"/ws","health":"/health"}';
    }

    location / {
        return 404;
    }
}
